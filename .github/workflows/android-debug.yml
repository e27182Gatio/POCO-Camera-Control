name: Construir APK Android (debug)
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Instalar SDK Android 16
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Extraer el código fuente
        run: unzip -q POCO-Camera-Control-v0.1-source.zip -d source
      - name: Compilar APK de prueba
        working-directory: source/POCO-Camera-Control
        run: gradle --no-daemon :app:assembleDebug
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: POCO-Camera-Control-debug-APK
          path: source/POCO-Camera-Control/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
